name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp index.html www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug and release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SpecStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Sign release APK
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > release.jks
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out SpecStudio-signed.apk aligned.apk
          $BT/apksigner verify SpecStudio-signed.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: SpecStudio-signed-apk
          path: SpecStudio-signed.apk
